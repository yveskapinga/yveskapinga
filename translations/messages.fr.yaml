    1:
      kicker: "Stratégie produit"
      title: "Des outils pensés pour durer"
      body: "Je construis des applications qui ne se limitent pas à une démo: elles doivent être utilisables, maintenables et adaptables à la réalité terrain."
    2:
      kicker: "Exécution"
      title: "Une approche orientée résultat"
      body: "Je pars des irritants opérationnels, je structure le besoin, puis je livre des solutions capables de simplifier l'exécution et la prise de décision."
    3:
      kicker: "Confiance"
      title: "Entre rigueur et pragmatisme"
      body: "Mon expérience industrielle m'amène à privilégier la clarté, la fiabilité des données et la robustesse des workflows plutôt que la complexité inutile."
profile:
  label: "Executive profile"
  title: "Profil hybride, orienté exécution"
  summary: "À l'aise entre environnement industriel, développement full-stack, data analyse et exigences de conformité, je livre des produits qui restent lisibles pour les équipes et fiables pour la direction."
  facts:
    1: "Full-stack: Symfony, Laravel, Node.js, React, Vue.js"
    2: "Data et pilotage: KPI, contrôle qualité, reporting, analyse d'écarts"
    3: "Industrie: ISO 9001, 14001, 45001, Lean Six Sigma"
summary:
  title: "Résumé professionnel"
  body: "Mon parcours hybride me permet de comprendre à la fois les contraintes techniques, les exigences de conformité et la réalité opérationnelle. Je développe des solutions qui servent la performance, la fiabilité des données, la prise de décision et l'efficacité des équipes. Je poursuis actuellement un MBA avec un focus sur la transformation digitale, l'optimisation des systèmes et la croissance de solutions technologiques évolutives."
  quote: "Je ne développe pas seulement des fonctionnalités: je conçois des systèmes utiles, compréhensibles et déployables dans des environnements où l'exécution compte vraiment."
delivery:
  title: "Ma façon de livrer"
  items:
    1: "Clarifier les processus avant d'écrire le code"
    2: "Transformer les contraintes métier en parcours simples et exploitables"
    3: "Chercher l'impact opérationnel avant l'effet de vitrine"
