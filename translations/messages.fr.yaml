      period: "2016 - 2017"
      body: "Animation de formations logicielles et conception d'applications pour les processus business."
    8:
      title: "Analyste de données - Knight Piesold Consulting"
      period: "2015 - 2016"
      body: "Conception de bases de données et de rapports analytiques pour soutenir les décisions opérationnelles."
    9:
      title: "Stagiaire - Analyse chimique, Office Congolais de Contrôle (OCC)"
      period: "2015"
      body: "Réalisation d'analyses de laboratoire et support au contrôle qualité."
projects:
  eyebrow: "Sélection récente"
  title: "Applications et plateformes déjà déployées"
  intro: "Voici une sélection représentative d'applications métier et de produits déployés pour la gestion, la conformité, l'opérationnel et l'aide à la décision."
  items:
    1:
      kicker: "Industrie"
      title: "Système de suivi industriel"
      body: "Tableau de bord full-stack pour suivre les KPI de production, visualiser la teneur, la récupération et le rendement, et soutenir les arbitrages opérationnels."
      outcome: "Résultat: meilleure lisibilité des indicateurs critiques pour le suivi métallurgique et la décision terrain."
    2:
      kicker: "Conformité"
      title: "Normind"
      body: "Application d'aide à la décision pour les non-conformités, conçue pour les auditeurs et les équipes qualité avec logique de suivi, arbitrage et reporting."
      outcome: "Résultat: processus de traitement des non-conformités plus structuré, plus traçable et plus défendable en audit."
    3:
      kicker: "Mobilité"
      title: "TaxApp"
      body: "Application de gestion de flotte de taxi avec gestion opérationnelle, suivi des activités et structuration des processus de service."
      outcome: "Résultat: meilleure organisation du suivi de flotte, des activités et des opérations quotidiennes."
    4:
      kicker: "Distribution"
      title: "Mayigo"
      body: "Application de commande et de distribution d'eau potable dans les points de vente, avec logique métier adaptée à la disponibilité et à la distribution."
      outcome: "Résultat: meilleure fluidité entre commande, disponibilité produit et distribution au point de vente."
    5:
      kicker: "Communautaire"
      title: "Bilan"
      body: "Application spirituelle conçue pour les fidèles sacrificateurs, avec parcours fonctionnel adapté aux usages de la communauté."
      outcome: "Résultat: expérience plus accessible et mieux alignée sur les besoins spécifiques de la communauté ciblée."
    6:
      kicker: "Data et API"
      title: "APIs d'analyse et outils métier"
      body: "Ensemble d'APIs et d'applications sur mesure pour le calcul de performance, la détection d'anomalies, l'automatisation et le pilotage métier."
      outcome: "Résultat: automatisation accrue, calculs plus fiables et meilleure base pour les décisions opérationnelles."
    7:
      kicker: "Monitoring temps réel"
      title: "Liso"
      body: "Application de monitoring en temps réel des paramètres de production pour l'industrie minière, avec intégration d'équipements physiques pour la capture intégrée des données et dashboard interactif pour reporting automatique."
      outcome: "Résultat: visibilité immédiate des paramètres critiques, réduction du délai de réaction et reporting automatisé pour les équipes de production et de supervision."
