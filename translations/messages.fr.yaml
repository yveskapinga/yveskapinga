      period: "Sep 2018 - 2025"
      body: "Garantie de conformité aux standards internationaux de production, suivi des indicateurs qualité, et contribution à l'amélioration continue."
    6:
      title: "Administrateur - Action pour la Protection de l'Environnement (ONG)"
      period: "2016 - Aujourd'hui"
      body: "Pilotage de projets d'impact environnemental et appui aux opérations de terrain."
    7:
