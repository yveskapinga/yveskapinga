      period: "Mai 2025 - Aujourd'hui"
      body: "Suivi des KPI métallurgiques tels que la teneur, la récupération et le rendement, analyse des écarts de données, et amélioration de la fiabilité des rapports."
    3:
      title: "Développeur système - Success Globally Company"
      period: "Sep 2023 - Aujourd'hui"
      body: "Conception et déploiement de systèmes de gestion internes, développement d'applications full-stack, automatisation des workflows jusqu'à 40 %, et amélioration de la scalabilité backend."
    4:
      title: "Consultant - Analyse minière et environnementale, Mitra SK"
      period: "Mar 2022 - Mar 2024"
      body: "Développement des opérations en RDC, formation des équipes à l'analyse environnementale, et gestion du recrutement et des opérations terrain."
    5:
